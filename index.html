<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Fishing — One More Cast!</title>
<meta name="description" content="A tiny, addictive pixel-art fishing game. Cast, catch, sell, upgrade, explore.">
<meta name="theme-color" content="#0d1b3d">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0a1930;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    /* The canvas fills the whole tab — no letterbox, no framing. */
    background: #0a1930;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #0a1930;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    background: #0a1930;
    touch-action: none;
    cursor: default;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    justify-content: center;
    color: #cfe3ff;
    font-size: 14px;
    letter-spacing: 1px;
    text-align: center;
    padding: 24px;
  }
  #boot b { color: #ffd45e; font-size: 18px; letter-spacing: 2px; }
  #boot code { color: #8fb3e8; }
  #boot.hidden { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540" aria-label="Pixel Fishing game canvas"></canvas>
    <div id="boot">
      <b>PIXEL FISHING</b>
      <span>Loading…</span>
    </div>
  </div>

  <script type="module">
    import { boot } from './src/main.js';
    boot(document.getElementById('game')).catch((err) => {
      console.error(err);
      const el = document.getElementById('boot');
      el.classList.remove('hidden');
      el.innerHTML = '<b>PIXEL FISHING</b><span>Failed to start:<br><code>' +
        String(err && err.message || err).replace(/</g, '&lt;') + '</code></span>';
    });
  </script>
</body>
</html>
